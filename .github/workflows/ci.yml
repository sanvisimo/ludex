# Lint, typecheck e test a ogni push, sui runner di GitHub. Su `main`, se
# passano, costruisce l'immagine e la pubblica su GHCR.
#
# Il deploy non sta qui: lo tira il mini PC, che scarica l'immagine quando
# cambia. Un'immagine esiste solo se i test sono passati, e su GitHub non c'è
# nessuna credenziale del server.
name: CI

on:
  push:

permissions:
  contents: read

# Un push nuovo sullo stesso branch annulla la corsa di prima. Su `main` non è
# solo risparmio: senza, un job d'immagine più lento potrebbe finire dopo
# quello del commit successivo e riportare `:main` indietro.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # I test di apps/api girano contro un Postgres vero, con la stessa immagine
    # del docker-compose.yml. Porte standard: qui la 5432 non è di nessun altro.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ludex
          POSTGRES_PASSWORD: ludex
          POSTGRES_DB: ludex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ludex -d ludex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Il .env qui non c'è. Valori finti ma validi: `test/env.ts` vuole
    # TEST_DATABASE_URL diversa da DATABASE_URL, e STORE_TOKEN_KEY deve essere
    # di 32 byte esatti. Il database di test lo crea il global setup.
    env:
      DATABASE_URL: postgresql://ludex:ludex@localhost:5432/ludex
      TEST_DATABASE_URL: postgresql://ludex:ludex@localhost:5432/ludex_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      STORE_TOKEN_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v5

      # La versione di pnpm la prende da `packageManager` nel package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Le storie di @repo/ui girano in un Chromium vero (addon-vitest).
      - run: pnpm --filter @repo/ui exec playwright install --with-deps chromium

      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test

  image:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Il GITHUB_TOKEN del workflow basta: nessun segreto da aggiungere.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Un merge che tocca solo il mobile, i piani o la documentazione non
      # cambia niente di quello che gira sul server: senza un'immagine nuova il
      # mini PC non riavvia. Il confronto è col commit dell'immagine `:main`
      # pubblicata, non col push precedente: una corsa annullata da un push
      # più nuovo non ha pubblicato niente, e le sue modifiche vanno contate.
      # Si elenca cosa escludere, così un file dimenticato costa al più un
      # rilascio in più, mai uno saltato. L'etichetta si cerca ovunque nel
      # JSON perché con le attestazioni `:main` è un indice, non un'immagine.
      - id: changes
        run: |
          published=$(docker buildx imagetools inspect ghcr.io/sanvisimo/ludex:main \
            --format '{{json .Image}}' 2>/dev/null \
            | jq -r '[.. | objects | .Labels? // empty | .["org.opencontainers.image.revision"]? // empty] | first // empty')
          if [ -z "$published" ] || ! git cat-file -e "$published^{commit}" 2>/dev/null; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$published" "$GITHUB_SHA" \
            | grep -vE '^(apps/mobile/|plans/|docs/)|\.md$' | grep -q .; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
            echo "Da $published cambiano solo mobile, piani o documentazione: nessuna immagine nuova." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.changes.outputs.server == 'true'

      # La chiave pubblica di Turnstile entra nel bundle come l'URL dell'API:
      # non è un segreto, sta nelle variabili del repo (Settings → Secrets and
      # variables → Actions → Variables). Vuota, il widget non compare.
      # `:main` è quella che il mini PC scarica, `:<sha>` serve a tornare
      # indietro. `source` lega il pacchetto al repo su GitHub, `revision` dice
      # al mini PC quale commit sta installando.
      - uses: docker/build-push-action@v7
        if: steps.changes.outputs.server == 'true'
        with:
          context: .
          push: true
          build-args: |
            PUBLIC_API_URL=https://pilecue.com
            PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          tags: |
            ghcr.io/sanvisimo/ludex:main
            ghcr.io/sanvisimo/ludex:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
