# Lint, typecheck e test a ogni push, sui runner di GitHub. Su `main`, se
# passano, costruisce l'immagine e la pubblica su GHCR.
#
# Il deploy non sta qui: lo tira il mini PC, che scarica l'immagine quando
# cambia. Un'immagine esiste solo se i test sono passati, e su GitHub non c'è
# nessuna credenziale del server.
name: CI

on:
  push:

permissions:
  contents: read

# Un push nuovo sullo stesso branch annulla la corsa di prima. Su `main` non è
# solo risparmio: senza, un job d'immagine più lento potrebbe finire dopo
# quello del commit successivo e riportare `:main` indietro.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # I test di apps/api girano contro un Postgres vero, con la stessa immagine
    # del docker-compose.yml. Porte standard: qui la 5432 non è di nessun altro.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ludex
          POSTGRES_PASSWORD: ludex
          POSTGRES_DB: ludex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ludex -d ludex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Il .env qui non c'è. Valori finti ma validi: `test/env.ts` vuole
    # TEST_DATABASE_URL diversa da DATABASE_URL, e STORE_TOKEN_KEY deve essere
    # di 32 byte esatti. Il database di test lo crea il global setup.
    env:
      DATABASE_URL: postgresql://ludex:ludex@localhost:5432/ludex
      TEST_DATABASE_URL: postgresql://ludex:ludex@localhost:5432/ludex_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else
      STORE_TOKEN_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v5

      # La versione di pnpm la prende da `packageManager` nel package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Le storie di @repo/ui girano in un Chromium vero (addon-vitest).
      - run: pnpm --filter @repo/ui exec playwright install --with-deps chromium

      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test

  image:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Il GITHUB_TOKEN del workflow basta: nessun segreto da aggiungere.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:main` è quella che il mini PC scarica, `:<sha>` serve a tornare
      # indietro. `source` lega il pacchetto al repo su GitHub, `revision` dice
      # al mini PC quale commit sta installando.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: PUBLIC_API_URL=https://ludex.sanvisimo.tech
          tags: |
            ghcr.io/sanvisimo/ludex:main
            ghcr.io/sanvisimo/ludex:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
