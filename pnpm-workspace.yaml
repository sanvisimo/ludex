packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # esbuild scarica il binario per la piattaforma nel postinstall: senza build
  # script drizzle-kit e tsx non partono.
  esbuild: true
  # Entrambi arrivano da next-intl e pubblicano i binari come dipendenze
  # opzionali per piattaforma: il build script non serve. @swc/core lo usa solo
  # l'estrattore di messaggi, @parcel/watcher solo il ricarico dei messaggi in dev.
  '@swc/core': false
  '@parcel/watcher': false
  # acceleratore nativo opzionale di msgpackr (BullMQ): senza, si usa il
  # fallback in JS. Nessuna perdita funzionale, un binario in meno da compilare.
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - '@better-auth/core@1.6.27'
  - '@better-auth/drizzle-adapter@1.6.27'
  - '@better-auth/kysely-adapter@1.6.27'
  - '@better-auth/memory-adapter@1.6.27'
  - '@better-auth/mongo-adapter@1.6.27'
  - '@better-auth/prisma-adapter@1.6.27'
  - '@better-auth/telemetry@1.6.27'
  - better-auth@1.6.27
# Una React sola in tutto il repo, alla versione che Expo fissa per la sua SDK.
# Metro compila il sorgente di `packages/ui` risolvendo gli import dalla sua
# cartella: con due versioni nel monorepo il bundle mobile ne conterrebbe due, e
# due React rompono gli hook. Senza override, `better-auth` e i peer di Next ne
# tiravano dentro altre (19.2.0, 19.3.0). Si alza insieme alla SDK di Expo.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
