services:
  postgres:
    # immagine con pgvector già installato: l'estensione va abilitata sul server,
    # non è una dipendenza npm. Serve dallo step 7, ma partire con l'immagine
    # giusta costa zero.
    image: pgvector/pgvector:pg17
    container_name: ludex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ludex
      POSTGRES_PASSWORD: ludex
      POSTGRES_DB: ludex
    # 5433 sull'host: la 5432 è occupata da un altro progetto.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludex -d ludex"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Coda BullMQ. Serve dallo step 3: il worker di enrichment gira in un
    # processo separato da quello che serve le richieste HTTP.
    image: redis:8-alpine
    container_name: ludex-redis
    restart: unless-stopped
    # appendonly: i job in coda sopravvivono a un riavvio del container.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
